[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cresco8-hw-bench"
version = "0.1.0"
description = "Reproducible CPU, DDR, HBM, AVX-512, and AMX Roofline benchmarks"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
analysis = ["jupyter>=1.0", "kaleido>=0.2", "numpy>=1.24", "pandas>=2.0", "plotly>=5.18"]
test = ["pytest>=7"]

[project.scripts]
hwbench-topology = "hwbench.topology:main"
hwbench-process = "hwbench.process:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
